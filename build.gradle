plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.36'
}

group = 'net.kncraft'
version = '1.0.0'
base.archivesName = 'witherstorm-bluemap-1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { witherstormbluemap { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://repo.bluecolored.de/releases' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    compileOnly 'de.bluecolored.bluemap:BlueMapAPI:2.7.2'
    testImplementation 'de.bluecolored.bluemap:BlueMapAPI:2.7.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.mockito:mockito-core:5.12.0'
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar') { finalizedBy 'reobfJar' }
tasks.named('test') { useJUnitPlatform() }
