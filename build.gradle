plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.36'
}

group = 'net.kncraft'
// GitHub Releases supplies this property; local builds use the first release version.
version = providers.gradleProperty('modVersion').getOrElse('1.0')
if (!(version ==~ /1\.(0|[1-9][0-9]*)/)) {
    throw new GradleException('modVersion must be a sequential version such as 1.0, 1.1, or 1.10')
}
base.archivesName = 'WitherStormBlueMap'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { witherstormbluemap { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://repo.bluecolored.de/releases' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    compileOnly 'de.bluecolored.bluemap:BlueMapAPI:2.7.2'
    testImplementation 'de.bluecolored.bluemap:BlueMapAPI:2.7.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.mockito:mockito-core:5.12.0'
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
    filesMatching('witherstormbluemap-version.properties') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar') {
    archiveFileName = "WitherStormBlueMap${project.version}.jar"
    finalizedBy 'reobfJar'
}
tasks.named('test') { useJUnitPlatform() }
